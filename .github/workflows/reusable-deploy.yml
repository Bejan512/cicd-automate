name: Reusable Deploy

on:
  workflow_call:
    inputs:
      provider:
        description: "Deployment provider (vercel, fly, cloudflare-pages, cloudflare-workers, aws-s3, custom)"
        type: string
        required: true
      environment:
        description: "GitHub Actions deployment environment name"
        type: string
        default: "production"
      working-directory:
        description: "Directory to deploy from"
        type: string
        default: "."
      project-name:
        description: "Project or app name (Cloudflare Pages, etc.)"
        type: string
        default: ""
      dist-dir:
        description: "Static build output directory (Cloudflare Pages / AWS S3)"
        type: string
        default: "dist"
      aws-region:
        description: "AWS region (for aws-s3)"
        type: string
        default: "us-east-1"
      s3-bucket:
        description: "Target S3 bucket (for aws-s3)"
        type: string
        default: ""
      build-command:
        description: "Optional build command before deploying"
        type: string
        default: ""
      deploy-command:
        description: "Custom deploy command (when provider == custom)"
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      FLY_API_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      AWS_ROLE_ARN:
        required: false
      DEPLOY_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy (${{ inputs.provider }} -> ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-deploy build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Deploy to Vercel
        if: inputs.provider == 'vercel'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Setup flyctl
        if: inputs.provider == 'fly'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: inputs.provider == 'fly'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Deploy to Cloudflare Pages
        if: inputs.provider == 'cloudflare-pages'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: pages deploy ${{ inputs.dist-dir }} --project-name=${{ inputs.project-name }}

      - name: Deploy to Cloudflare Workers
        if: inputs.provider == 'cloudflare-workers'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}

      - name: Configure AWS credentials
        if: inputs.provider == 'aws-s3'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync to AWS S3
        if: inputs.provider == 'aws-s3'
        run: aws s3 sync ${{ inputs.dist-dir }} s3://${{ inputs.s3-bucket }} --delete

      - name: Custom deploy
        if: inputs.provider == 'custom'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: ${{ inputs.deploy-command }}
