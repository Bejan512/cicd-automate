name: Reusable Generic CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory where commands are executed"
        type: string
        default: "."
      setup-command:
        description: "Optional shell command to install dependencies or tools"
        type: string
        default: ""
      lint-command:
        description: "Optional lint/format check command"
        type: string
        default: ""
      test-command:
        description: "Optional test command"
        type: string
        default: ""
      build-command:
        description: "Optional build command"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ci:
    name: Generic CI (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        if: inputs.setup-command != ''
        run: ${{ inputs.setup-command }}

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
