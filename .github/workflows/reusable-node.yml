name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing package.json"
        type: string
        default: "."
      package-manager:
        description: "Package manager (npm, pnpm, yarn, bun)"
        type: string
        default: "npm"
      node-version:
        description: "Node.js version (ignored if node-version-file is set)"
        type: string
        default: "22"
      node-version-file:
        description: "Path to .nvmrc or .node-version file"
        type: string
        default: ""
      install-command:
        description: "Optional custom install command"
        type: string
        default: ""
      run-lint:
        description: "Run lint step"
        type: boolean
        default: true
      lint-command:
        description: "Custom lint command (defaults to <pm> run lint)"
        type: string
        default: ""
      run-typecheck:
        description: "Run typecheck step"
        type: boolean
        default: false
      typecheck-command:
        description: "Custom typecheck command (defaults to <pm> run typecheck)"
        type: string
        default: ""
      run-test:
        description: "Run test step"
        type: boolean
        default: true
      test-command:
        description: "Custom test command (defaults to <pm> test)"
        type: string
        default: ""
      run-build:
        description: "Run build step"
        type: boolean
        default: true
      build-command:
        description: "Custom build command (defaults to <pm> run build)"
        type: string
        default: ""
      upload-coverage:
        description: "Upload coverage artifact"
        type: boolean
        default: false
      coverage-path:
        description: "Path to coverage report directory"
        type: string
        default: "coverage"

permissions:
  contents: read

jobs:
  ci:
    name: Node CI (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        if: inputs.package-manager != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory == '.' && '' || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || (inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json')) }}

      - name: Install dependencies
        run: |
          if [ -n "${{ inputs.install-command }}" ]; then
            ${{ inputs.install-command }}
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package-manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        if: inputs.run-lint
        run: |
          if [ -n "${{ inputs.lint-command }}" ]; then
            ${{ inputs.lint-command }}
          else
            ${{ inputs.package-manager }} run lint
          fi

      - name: Typecheck
        if: inputs.run-typecheck
        run: |
          if [ -n "${{ inputs.typecheck-command }}" ]; then
            ${{ inputs.typecheck-command }}
          else
            ${{ inputs.package-manager }} run typecheck
          fi

      - name: Test
        if: inputs.run-test
        run: |
          if [ -n "${{ inputs.test-command }}" ]; then
            ${{ inputs.test-command }}
          elif [ "${{ inputs.package-manager }}" = "bun" ]; then
            bun test
          else
            ${{ inputs.package-manager }} test
          fi

      - name: Build
        if: inputs.run-build
        run: |
          if [ -n "${{ inputs.build-command }}" ]; then
            ${{ inputs.build-command }}
          else
            ${{ inputs.package-manager }} run build
          fi

      - name: Upload coverage artifact
        if: inputs.upload-coverage && inputs.run-test
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage-${{ strategy.job-index }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-path }}
          if-no-files-found: ignore
