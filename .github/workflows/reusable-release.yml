name: Reusable Release

on:
  workflow_call:
    inputs:
      strategy:
        description: "Release strategy (release-please, tag-release, goreleaser)"
        type: string
        default: "release-please"
      release-type:
        description: "Release Please project type (simple, node, python, go, rust)"
        type: string
        default: "simple"
      go-version:
        description: "Go version when using goreleaser"
        type: string
        default: "1.24"
    secrets:
      RELEASE_TOKEN:
        description: "Optional PAT with contents/PR write access (defaults to GITHUB_TOKEN)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: inputs.strategy == 'release-please'
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.release-type }}

  tag-release:
    if: inputs.strategy == 'tag-release'
    name: GitHub Tag Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes

  goreleaser:
    if: inputs.strategy == 'goreleaser'
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
