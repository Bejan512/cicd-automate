name: Reusable Docker Build & Publish

on:
  workflow_call:
    inputs:
      context:
        description: "Docker build context directory"
        type: string
        default: "."
      dockerfile:
        description: "Path to Dockerfile"
        type: string
        default: "Dockerfile"
      registry:
        description: "Container registry (ghcr.io or docker.io)"
        type: string
        default: "ghcr.io"
      image-name:
        description: "Image name (defaults to github.repository)"
        type: string
        default: ""
      platforms:
        description: "Target platforms (e.g. linux/amd64,linux/arm64)"
        type: string
        default: "linux/amd64,linux/arm64"
      push:
        description: "Push image to registry (set false on pull requests)"
        type: boolean
        default: true
      scan-trivy:
        description: "Run Trivy vulnerability scan on built image"
        type: boolean
        default: true
      trivy-severity:
        description: "Trivy severities to fail on"
        type: string
        default: "CRITICAL,HIGH"
    secrets:
      REGISTRY_USERNAME:
        description: "Registry username (only needed for non-GHCR registries)"
        required: false
      REGISTRY_PASSWORD:
        description: "Registry password/token (only needed for non-GHCR registries)"
        required: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  docker:
    name: Docker (${{ inputs.dockerfile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: img
        run: |
          NAME="${{ inputs.image-name }}"
          if [ -z "$NAME" ]; then
            NAME="${{ github.repository }}"
          fi
          echo "name=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push && inputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to custom container registry
        if: inputs.push && inputs.registry != 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.push && inputs.platforms || 'linux/amd64' }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push && inputs.scan-trivy }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        if: inputs.scan-trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ inputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ inputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
        with:
          image-ref: ${{ inputs.registry }}/${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}
